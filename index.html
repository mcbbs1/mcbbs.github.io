    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0719;
            --accent-cyan: #00e5ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --text-light: #f0f0f5;
            --text-muted: #a8a6c0;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.08);
            --radius-lg: 28px;
            --radius-md: 16px;
            --glow-cyan: 0 0 40px rgba(0, 229, 255, 0.3);
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        /* ===== 星空背景 ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
            opacity: 0.3;
            width: var(--size, 2px);
            height: var(--size, 2px);
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        /* ===== 光晕装饰 ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .glow-orb--1 {
            width: 500px; height: 500px;
            background: var(--accent-purple);
            top: -10%; right: -10%;
        }
        .glow-orb--2 {
            width: 400px; height: 400px;
            background: var(--accent-cyan);
            bottom: -10%; left: -10%;
            animation-delay: 3s;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
            100% { transform: translate(10px, -10px) scale(1.05); }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 24px 40px;
            background: rgba(11, 7, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(168, 85, 247, 0.15));

            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }
        .badge i {
            font-size: 0.7rem;
        }

        /* ===== 标题区（居中） ===== */

        }

            font-weight: 900;

            -webkit-text-fill-color: transparent;

            gap: 24px;
            margin-top: 10px;
        }
        .col {
            flex: 1 1 calc(50% - 12px);

            backdrop-filter: blur(4px);

        }
        .download-card:hover {

            color: var(--accent-cyan);

        }

        .qr-box {

            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            display: flex;

            transition: transform 0.25s;

        .qr-box:hover {
            transform: scale(1.02);
        }
        .qr-box img {
            width: 155px;

            display: block;
            border-radius: 12px;
        }

        .qr-caption {

        }
        .qr-caption .main-tip {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .qr-caption .main-tip i {
            color: var(--accent-cyan);

        .expiry-warning {
            display: inline-block;
            background: rgba(236, 72, 153, 0.12);

            padding: 6px 18px;

        /* ===== 超链接按钮 ===== */

            font-size: 0.95rem;

            transition: all 0.3s;

            backdrop-filter: blur(4px);
        }
        .btn-link i {

        }
        .btn-link:hover {

            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);

        /* ===== 底部 ===== */
        .footnote {

        /* ===== 响应式 ===== */

            .expiry-warning { font-size: 0.75rem; padding: 4px 14px; }
            .btn-link { padding: 8px 22px; font-size: 0.85rem; }
        }
    </style>
</head>

    <!-- ===== 生成星星 ===== -->
